<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fravash — private beta</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
body{margin:0;background:#FFFFFF;color:#0A0A0C;font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#0A0A0C}
input,button{font-family:inherit}
input:focus{outline:none;border-color:#0A0A0C}
</style>
</head>
<body>
<div style="min-height:100vh;display:flex;flex-direction:column">
  <header style="max-width:1200px;width:100%;margin:0 auto;padding:28px 32px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between">
    <a href="/" style="display:inline-flex;align-items:center;gap:12px;font-weight:700;font-size:15px;letter-spacing:0.2em;text-transform:uppercase;color:#0A0A0C;text-decoration:none"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 100 100" fill="none"><path d="M92.5 38.61 A44 44 0 1 1 61.39 7.5" stroke="currentColor" stroke-width="9" stroke-linecap="round"></path><circle cx="50" cy="50" r="16" fill="currentColor"></circle></svg>Fravash</a>
    <a href="/" style="font-size:15px;font-weight:600;color:#0A0A0C;text-decoration:none">Back</a>
  </header>
  <main style="flex:1 1 auto;display:flex;align-items:center;justify-content:center;padding:40px 20px 120px">
    <div style="width:100%;max-width:560px;display:flex;flex-direction:column;gap:20px;text-align:center;align-items:center">
      <h1 style="margin:0;font-weight:800;font-size:clamp(34px,5vw,56px);line-height:1.02;letter-spacing:-0.035em">The platform is in private beta.</h1>
      <p style="margin:0;font-size:18px;line-height:1.5;color:#3A3A3F">Leave your email and we open your account personally. Or send your design straight to us.</p>
      <form action="mailto:hello@fravash.ai" method="post" enctype="text/plain" style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:100%;margin-top:8px">
        <label for="e" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Work email</label>
        <input id="e" name="email" type="email" placeholder="Work email" required style="flex:1 1 260px;min-height:52px;padding:0 18px;font-size:16px;border:1px solid #D9D9D6;border-radius:999px;background:#fff;color:#0A0A0C">
        <button type="submit" style="min-height:52px;padding:0 26px;background:#0A0A0C;color:#fff;border:0;border-radius:999px;font-weight:600;font-size:16px;cursor:pointer">Request access</button>
      </form>
      <p style="margin:0;font-size:14px;color:#6E6E73">Fravash · Amsterdam · <a href="mailto:hello@fravash.ai">hello@fravash.ai</a></p>
    </div>
  </main>
</div>
</body>
</html>
