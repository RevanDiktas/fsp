<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fravash — private beta</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0;background:#FFFFFF;color:#141416;font-family:'Hanken Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#141416}
input,button{font-family:inherit}
input:focus{outline:none;border-color:#141416}
input::placeholder{color:#A1A1A6}
</style>
</head>
<body>
<div style="min-height:100vh;display:flex;flex-direction:column">
  <header style="width:100%;border-bottom:1px solid #C9C7C2;display:flex;align-items:center;justify-content:space-between">
    <a href="/" style="display:inline-flex;align-items:center;gap:12px;padding:26px 32px;font-weight:700;font-size:15px;letter-spacing:0.2em;text-transform:uppercase;color:#141416;text-decoration:none;border-right:1px solid #C9C7C2"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 100 100" fill="none"><path d="M92.5 38.61 A44 44 0 1 1 61.39 7.5" stroke="currentColor" stroke-width="9" stroke-linecap="round"></path><circle cx="50" cy="50" r="16" fill="currentColor"></circle></svg>Fravash</a>
    <a href="/" style="padding:0 32px;font-size:12px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#3A3A3F;text-decoration:none">← Back</a>
  </header>
  <main style="flex:1 1 auto;display:flex;align-items:center;justify-content:center;padding:40px 20px 120px">
    <div style="width:100%;max-width:620px;display:flex;flex-direction:column;gap:22px;text-align:center;align-items:center">
      <span style="font-size:13px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#6E6E73">Client portal</span>
      <h1 style="margin:0;font-weight:400;font-size:clamp(40px,6.4vw,80px);line-height:0.98;letter-spacing:-0.02em;text-transform:uppercase">Private beta</h1>
      <p style="margin:0;font-size:18px;line-height:1.5;color:#3A3A3F">Leave your email and we open your account personally. Or send your design straight to us.</p>
      <form action="mailto:hello@fravash.ai" method="post" enctype="text/plain" style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:100%;margin-top:8px">
        <label for="e" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Work email</label>
        <input id="e" name="email" type="email" placeholder="Work email" required style="flex:1 1 260px;min-height:52px;padding:0 18px;font-size:16px;border:1px solid #141416;border-radius:999px;background:transparent;color:#141416">
        <button type="submit" style="min-height:52px;padding:0 26px;background:#141416;color:#fff;border:0;border-radius:999px;font-weight:600;font-size:16px;cursor:pointer">Request access</button>
      </form>
      <p style="margin:0;font-size:14px;color:#6E6E73">Fravash · Amsterdam · <a href="mailto:hello@fravash.ai">hello@fravash.ai</a></p>
    </div>
  </main>
</div>
</body>
</html>
